services:
  blazor-wasm:
    build:
      context: ../../blazor-wasm
      dockerfile: Dockerfile
    container_name: blazor-wasm
    ports:
      - "${BLAZOR_WASM_PORT}:80"
    env_file:
      - .env

  webapi:
    build:
      context: ../../webapi
      dockerfile: Dockerfile
    container_name: webapi
    ports:
      - "${WEBAPI_PORT}:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=recht_und_ordnung;Username=recht_und_ordnung;Password=${POSTGRES_PASSWORD}
    depends_on:
      - postgres
      - mailhog

  postgres:
    image: postgres:16-alpine
    container_name: blazor-postgres
    environment:
      - POSTGRES_USER=recht_und_ordnung
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=recht_und_ordnung
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recht_und_ordnung"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI

volumes:
  postgres-data:
