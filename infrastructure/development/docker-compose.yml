services:
  blazor-wasm:
    build:
      context: ../../blazor-wasm
      dockerfile: Dockerfile
    container_name: blazor-wasm
    ports:
      - "${BLAZOR_WASM_PORT}:80"
    environment:
      - API_URL=${API_URL}

  webapi:
    build:
      context: ../../webapi
      dockerfile: Dockerfile
    container_name: webapi
    ports:
      - "${WEBAPI_PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB};Username=postgres;Password=postgres
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SMTP__Host=${SMTP_HOST}
      - SMTP__Port=${SMTP_PORT}
      - SMTP__FromEmail=${SMTP_FROM_EMAIL}
      - SMTP__FromName=${SMTP_FROM_NAME}
      - FrontendUrl=${FRONTEND_URL}
    depends_on:
      - postgres
      - mailhog

  postgres:
    image: postgres:16-alpine
    container_name: blazor-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI

volumes:
  postgres-data:
