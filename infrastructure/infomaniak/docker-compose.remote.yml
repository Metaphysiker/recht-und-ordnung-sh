services:
  blazor-wasm:
    image: recht-und-ordnung-sh-production-blazor:latest
    container_name: recht-und-ordnung-sh-blazor
    restart: unless-stopped
    ports:
      - "${BLAZOR_WASM_PORT:-3000}:80"
    environment:
      - API_URL=${API_URL}

  webapi:
    image: recht-und-ordnung-sh-production-webapi:latest
    container_name: recht-und-ordnung-sh-webapi
    restart: unless-stopped
    ports:
      - "${WEBAPI_PORT:-5001}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=recht_und_ordnung;Username=recht_und_ordnung;Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SMTP__Host=${SMTP_HOST}
      - SMTP__Port=${SMTP_PORT}
      - SMTP__FromEmail=${SMTP_FROM_EMAIL}
      - SMTP__FromName=${SMTP_FROM_NAME}
      - SMTP__Username=${SMTP_USERNAME}
      - SMTP__Password=${SMTP_PASSWORD}
      - SMTP__EnableSsl=${SMTP_ENABLE_SSL:-true}
      - FrontendUrl=${FRONTEND_URL}
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: recht-und-ordnung-sh-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=recht_und_ordnung
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=recht_und_ordnung
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recht_und_ordnung"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
