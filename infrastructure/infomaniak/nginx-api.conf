# Nginx configuration for WebAPI Backend
# Place this file in: /etc/nginx/sites-available/recht-und-ordnung-api
# Then create symlink: sudo ln -s /etc/nginx/sites-available/recht-und-ordnung-api /etc/nginx/sites-enabled/
# Run certbot: sudo certbot --nginx -d recht-und-ordnung-api.sandro-raess.ch

server {
    listen 80;
    server_name recht-und-ordnung-api.sandro-raess.ch;
    
    location / {
        proxy_pass http://localhost:8071/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Additional headers for API
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Increase timeouts for long-running requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
