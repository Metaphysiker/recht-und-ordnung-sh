# Nginx configuration for Blazor WASM Frontend
# Place this file in: /etc/nginx/sites-available/recht-und-ordnung-frontend
# Then create symlink: sudo ln -s /etc/nginx/sites-available/recht-und-ordnung-frontend /etc/nginx/sites-enabled/
# Run certbot: sudo certbot --nginx -d recht-und-ordnung.sandro-raess.ch

server {
    listen 80;
    server_name recht-und-ordnung.sandro-raess.ch;
    
    location / {
        proxy_pass http://localhost:8070/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
